# ==============================================================================
# MHD REAL ESTATE TECH • COMPLETE PRODUCTION STACK
# PostGIS 16 + Redis 7 + FastAPI Backend (4 workers) + Nginx React Frontend
# ==============================================================================

services:
  # 1. PostGIS Database (Spatial Engine & Comparables Storage)
  postgis:
    image: postgis/postgis:16-3.4
    container_name: mhd_postgis_prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mhd_valuation}
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./database/01_init_postgis.sql:/docker-entrypoint-initdb.d/01_init_postgis.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mhd_valuation"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mhd_network

  # 2. Redis Caching Engine
  redis:
    image: redis:7-alpine
    container_name: mhd_redis_prod
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - mhd_network

  # 3. FastAPI AI Backend Microservice
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mhd_backend_prod
    restart: always
    environment:
      - POSTGRES_HOST=postgis
      - POSTGRES_PORT=5432
      - POSTGRES_DB=${POSTGRES_DB:-mhd_valuation}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - mhd_network

  # 4. Frontend Web Server & Reverse Proxy (React SPA + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mhd_frontend_prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - mhd_network

networks:
  mhd_network:
    driver: bridge

volumes:
  postgis_data:
    driver: local
  redis_data:
    driver: local
